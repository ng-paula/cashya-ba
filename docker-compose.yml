# Run the whole system:   docker compose up --build
#   App:      http://localhost:8080
#   API docs: http://localhost:8000/docs
#   n8n:      http://localhost:5678
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/cashya-events}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"

  n8n:
    image: n8nio/n8n:1.72.1
    environment:
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      CASHYA_API_URL: http://backend:8000
      CASHYA_AUTOMATION_KEY: ${AUTOMATION_API_KEY:-dev-automation-key}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  backend-data:
  n8n-data:
